<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="변리사 민법·특허법 O/X 문제풀이">
<link rel="manifest" href="manifest.json">
<title>민법 터치</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">민법 <b>터치</b></div>
  <button id="resetBtn" class="ghost">진행상황 초기화</button>
</header>
<main class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">CIVIL · PATENT</div>
      <h1>민법 터치</h1>
      <p>랜덤 출제 · 1회독 중복 방지 · 오답 누적 · 빈칸 2지선다</p>
    </div>
  </section>

  <section class="controls card">
    <div class="control-row">
      <div class="field grow">
        <label>과목</label>
        <div class="seg" id="subjectSeg">
          <button data-subject="민법" class="active">민법</button>
          <button data-subject="특허법">특허법</button>
        </div>
      </div>
      <div class="field">
        <label>출제 범위</label>
        <select id="chapterSelect"><option value="all">전체</option></select>
      </div>
      <div class="field">
        <label>문제 모드</label>
        <select id="modeSelect">
          <option value="all">전체 랜덤</option>
          <option value="unanswered">미풀이만</option>
          <option value="wrong">오답만</option>
          <option value="frequent">자주 틀린 문제 (2회 이상)</option>
        </select>
      </div>
    </div>
  </section>

  <section class="stats-grid">
    <div class="stat card"><span>전체</span><strong id="totalStat">0</strong></div>
    <div class="stat card"><span>풀이</span><strong id="attemptStat">0</strong></div>
    <div class="stat card"><span>정답률</span><strong id="accuracyStat">0%</strong></div>
    <div class="stat card"><span>오답</span><strong id="wrongStat">0</strong></div>
  </section>

  <section class="progress card">
    <div class="progress-head"><span id="cycleText">1회독 준비</span><span id="cycleCount">0 / 0</span></div>
    <div class="bar"><i id="cycleBar"></i></div>
  </section>

  <section class="question card" id="questionCard">
    <div class="q-meta"><span id="chapterBadge">민법총칙</span><span id="qNumber">문제 1</span></div>
    <div id="questionText" class="question-text">문제를 불러오는 중…</div>
    <div class="answer-buttons">
      <button class="choice" data-answer="">1</button>
      <button class="choice" data-answer="">2</button>
    </div>
    <div id="result" class="result hidden"></div>
    <div id="explanation" class="explanation hidden"></div>
    <button id="nextBtn" class="next hidden">다음 문제 →</button>
  </section>

  <section class="actions">
    <button id="wrongOnlyBtn" class="secondary">오답만 바로 풀기</button>
    <button id="allBtn" class="secondary">전체 랜덤으로 돌아가기</button>
  </section>

  <section class="note card">
    <b>자료 기준</b>
    <p>민법은 사용자가 제공한 민법 O/X 자료와 「민법 파이널 리뷰 취합본_292(2).pdf」를 기준으로 구성했습니다. 특허법은 기존 특허법 O/X 재분류본의 지문·정답·풀이를 사용합니다.</p>
    <p>학습 진행·오답 횟수·정답률은 이 기기의 브라우저에만 저장됩니다.</p>
  </section>
</main>
<footer>변리사 O/X 문제풀이 · 개인 학습용</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
