<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="민법 터치">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>민법 터치</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--good:#047857;--goodbg:#ecfdf5;--bad:#b91c1c;--badbg:#fef2f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,select{font:inherit}
button{touch-action:manipulation}
.app{max-width:720px;margin:0 auto;min-height:100dvh}
header{position:sticky;top:0;z-index:10;background:rgba(245,246,250,.95);backdrop-filter:blur(14px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:20px;font-weight:850}
.headBtns{display:flex;gap:7px}
.iconBtn{width:42px;height:42px;border:0;border-radius:13px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:#111827;width:0;transition:.2s}
main{padding:15px}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar select,.toolbar button{flex:1;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 10px;font-weight:750}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:17px;box-shadow:0 7px 24px rgba(17,24,39,.05)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:9px}
.step{font-size:13px;font-weight:800;margin-bottom:10px}
.question{font-size:18px;line-height:1.72;font-weight:730;white-space:pre-wrap}
.currentBlank{background:#111827;color:#fff;padding:1px 5px;border-radius:6px}
.doneBlank{background:#e5e7eb;color:#374151;padding:1px 5px;border-radius:6px}
.choices{margin-top:15px}
.choice{width:100%;text-align:left;border:2px solid #e5e7eb;background:#fff;border-radius:16px;padding:14px;margin:8px 0;line-height:1.45;cursor:pointer}
.choice.correct{border-color:var(--good);background:var(--goodbg);color:#065f46}
.choice.wrong{border-color:var(--bad);background:var(--badbg);color:#991b1b}
.choice.dim{opacity:.5}.choice:disabled{cursor:default}
.num{display:inline-grid;place-items:center;width:30px;height:30px;background:#f3f4f6;border-radius:9px;margin-right:8px;font-weight:850}
.feedback{display:none;margin-top:12px;border-radius:14px;padding:12px;line-height:1.5}
.feedback.show{display:block}.feedback.good{background:var(--goodbg)}.feedback.bad{background:var(--badbg)}
.explain{margin-top:6px;font-size:14px;color:#374151}.src{margin-top:5px;font-size:12px;color:var(--muted)}
.controls{display:flex;gap:8px;margin-top:12px}.ctrl{flex:1;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:800}.primary{background:#111827;color:#fff;border-color:#111827}
.notice{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;align-items:flex-end}
.modal.show{display:flex}.sheet{width:100%;max-width:720px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px}.sheet p{font-size:13px;color:var(--muted);line-height:1.55}
.sheet button,.sheet label{display:block;width:100%;padding:12px;border:1px solid var(--line);background:#fff;border-radius:13px;margin-top:8px;font-weight:750;text-align:center}
.sheet .dark{background:#111827;color:#fff;border-color:#111827}.sheet input{display:none}
.hidden{display:none!important}
@media (max-width:480px){.question{font-size:17px}.card{padding:15px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="top">
    <div class="brand">⚖️ 민법 터치</div>
    <div class="headBtns">
      <button class="iconBtn" id="statsBtn">📊</button>
      <button class="iconBtn" id="settingsBtn">⚙️</button>
    </div>
  </div>
  <div class="progress"><div id="bar"></div></div>
</header>
<main>
  <div class="toolbar">
    <select id="mode">
      <option value="all">전체 문제</option>
      <option value="wrong">오답 집중</option>
    </select>
    <select id="subject">
      <option value="민법">민법</option>
    </select>
  </div>

  <div class="stats">
    <div class="stat"><b id="r">0</b><span>정답</span></div>
    <div class="stat"><b id="w">0</b><span>오답</span></div>
    <div class="stat"><b id="rate">0%</b><span>정답률</span></div>
  </div>

  <section class="card">
    <div class="meta"><span id="qno"></span><span id="slot"></span></div>
    <div class="step" id="step"></div>
    <div class="question" id="qtext"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback">
      <b id="ft"></b><div class="explain" id="fx"></div><div class="src" id="fs"></div>
    </div>
    <div class="controls">
      <button class="ctrl" id="restart">이 문장 처음부터</button>
      <button class="ctrl primary" id="next">다음 문제</button>
    </div>
    <div class="notice" id="notice"></div>
  </section>
</main>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>설정 / 정답 업데이트</h2>
    <p>나중에 새 정답 파일을 받으면 <b>answers.json</b> 또는 <b>정답_업데이트용.csv</b>를 교체할 수 있습니다. 지금은 브라우저에서 직접 정답 JSON을 가져와 즉시 반영할 수도 있습니다.</p>
    <label class="dark" for="answerFile">정답 JSON 가져오기</label>
    <input id="answerFile" type="file" accept=".json,application/json">
    <button id="exportBtn">현재 정답 데이터 내보내기</button>
    <button id="clearStats">오답/통계 초기화</button>
    <button id="closeModal">닫기</button>
  </div>
</div>

<script>
let BANK=[], ANSWERS={}, queue=[], current=null, slotIndex=0, locked=false;
let stats=JSON.parse(localStorage.getItem('myn_civil_stats')||'{}');

const $=id=>document.getElementById(id);
const blankRe=/\[(?:\s*\.?\s*)\]/g;

function saveStats(){localStorage.setItem('myn_civil_stats',JSON.stringify(stats))}
function key(qid,slot){return qid+":"+slot}
function getStats(qid,slot){return stats[key(qid,slot)]||{right:0,wrong:0}}
function setStats(qid,slot,ok){let s=getStats(qid,slot); ok?s.right++:s.wrong++; stats[key(qid,slot)]=s; saveStats(); updateStats();}
function questionErrorCount(q){let t=0; for(let s=0;s<q.slots;s++) t+=getStats(q.id,s).wrong; return t}
function hasAllAnswers(q){for(let s=0;s<q.slots;s++){let a=ANSWERS[key(q.id,s)]; if(!a || a.answerIndex===null || !Array.isArray(a.options) || a.options.length!==4) return false;} return true}
function shuffled(a){a=[...a]; for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a}
function buildQueue(){
  const mode=$('mode').value;
  let qs=BANK.filter(q=>q.subject===$('subject').value && hasAllAnswers(q));
  if(mode==='wrong') qs=qs.filter(q=>questionErrorCount(q)>0);
  // Higher-error questions get more weight in wrong mode, but each question can appear once per cycle.
  if(mode==='wrong'){
    const weighted=[];
    qs.forEach(q=>{const n=Math.min(6,Math.max(1,questionErrorCount(q))); for(let i=0;i<n;i++) weighted.push(q)});
    qs=[...new Map(shuffled(weighted).map(q=>[q.id,q])).values()];
  } else qs=shuffled(qs);
  queue=qs;
  $('notice').textContent=`현재 정답이 준비된 문제 ${qs.length}개 / 전체 ${BANK.length}개. 정답이 없는 문제는 정답 파일 업데이트 후 자동으로 출제됩니다.`;
}
function nextQuestion(){
  if(queue.length===0) buildQueue();
  if(queue.length===0){alert('현재 선택된 모드에서 출제 가능한 문제가 없습니다.');return}
  current=queue.pop(); slotIndex=0; render();
}
function renderText(){
  let i=0;
  const html=current.text.replace(blankRe,()=>{
    const n=i++;
    if(n<slotIndex) return '<span class="doneBlank">정답</span>';
    if(n===slotIndex) return '<span class="currentBlank">현재 빈칸</span>';
    return '<span class="doneBlank">빈칸 '+(n+1)+'</span>';
  });
  $('qtext').innerHTML=html.replace(/\n/g,'<br>');
}
function render(){
  locked=false;
  const a=ANSWERS[key(current.id,slotIndex)];
  const total=current.slots;
  $('qno').textContent=current.id+'번';
  $('slot').textContent='빈칸 '+(slotIndex+1)+' / '+total;
  $('step').textContent=total>1?'이 문장의 빈칸을 앞에서부터 하나씩 풉니다.':'정답을 하나 선택하세요.';
  renderText();
  $('choices').innerHTML='';
  $('feedback').className='feedback';
  $('ft').textContent='';$('fx').textContent='';$('fs').textContent='';
  a.options.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='choice';
    b.innerHTML='<span class="num">'+['①','②','③','④'][i]+'</span>'+escapeHtml(o);
    b.onclick=()=>answer(i);
    $('choices').appendChild(b);
  });
  $('bar').style.width=((slotIndex+1)/total*100)+'%';
}
function answer(i){
  if(locked)return; locked=true;
  const a=ANSWERS[key(current.id,slotIndex)];
  const bs=[...document.querySelectorAll('.choice')];
  bs.forEach((b,n)=>{if(n===a.answerIndex)b.classList.add('correct'); if(n===i&&i!==a.answerIndex)b.classList.add('wrong'); if(n!==a.answerIndex&&n!==i)b.classList.add('dim'); b.disabled=true});
  const ok=i===a.answerIndex;
  setStats(current.id,slotIndex,ok);
  $('feedback').className='feedback show '+(ok?'good':'bad');
  $('ft').textContent=ok?'✅ 정답':'❌ 오답 — 정답은 '+['①','②','③','④'][a.answerIndex]+'번';
  $('fx').textContent=a.explanation||'';
  $('fs').textContent=a.verified?'출처 기준 확인 답안':'초안 답안 — 나중에 정답지로 교체 가능';
  setTimeout(()=>{
    if(slotIndex+1<current.slots){slotIndex++;render();}
    else nextQuestion();
  }, ok?650:1100);
}
function updateStats(){
  let r=0,w=0; Object.values(stats).forEach(s=>{r+=s.right||0;w+=s.wrong||0});
  $('r').textContent=r;$('w').textContent=w;
  $('rate').textContent=(r+w)?Math.round(r/(r+w)*100)+'%':'0%';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function exportAnswers(){
  const blob=new Blob([JSON.stringify(ANSWERS,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='answers.json'; a.click(); URL.revokeObjectURL(url);
}
$('next').onclick=nextQuestion;
$('restart').onclick=()=>{slotIndex=0;render()};
$('mode').onchange=()=>{buildQueue();nextQuestion()};
$('subject').onchange=()=>{buildQueue();nextQuestion()};
$('settingsBtn').onclick=()=>$('modal').classList.add('show');
$('closeModal').onclick=()=>$('modal').classList.remove('show');
$('statsBtn').onclick=()=>alert('누적 정답: '+$('r').textContent+'\\n누적 오답: '+$('w').textContent+'\\n전체 정답률: '+$('rate').textContent);
$('clearStats').onclick=()=>{if(confirm('오답 및 통계를 모두 초기화할까요?')){stats={};saveStats();updateStats();$('modal').classList.remove('show');}};
$('answerFile').onchange=async e=>{const f=e.target.files[0];if(!f)return; try{const obj=JSON.parse(await f.text()); ANSWERS={...ANSWERS,...obj}; localStorage.setItem('myn_civil_answers',JSON.stringify(ANSWERS)); alert('정답 파일을 반영했습니다.'); $('modal').classList.remove('show'); buildQueue(); nextQuestion();}catch(err){alert('JSON 형식이 올바르지 않습니다.');}};
async function init(){
  try{
    BANK=await fetch('./questions.json').then(r=>r.json());
    const remote=await fetch('./answers.json').then(r=>r.json());
    ANSWERS=JSON.parse(localStorage.getItem('myn_civil_answers')||'null')||remote;
  }catch(e){document.body.innerHTML='<div style="padding:30px;font-family:sans-serif">데이터를 불러오지 못했습니다.</div>';return}
  updateStats(); buildQueue(); nextQuestion();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
init();
</script>
</body>
</html>
