<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="민법 터치">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>민법 터치</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--good:#047857;--goodbg:#ecfdf5;--bad:#b91c1c;--badbg:#fef2f2;--accent:#111827}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input{font:inherit}
button{touch-action:manipulation}
.app{max-width:720px;margin:0 auto;min-height:100dvh}
header{position:sticky;top:0;z-index:10;background:rgba(246,247,251,.95);backdrop-filter:blur(14px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:850;font-size:20px}
.settings{border:0;background:#fff;width:42px;height:42px;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:20px}
.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:#111827;width:0%;transition:.25s}
main{padding:16px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 10px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 7px 25px rgba(17,24,39,.05)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}
.step{font-size:13px;font-weight:800;margin-bottom:10px}
.question{font-size:19px;line-height:1.72;font-weight:720;white-space:pre-wrap}
.blank-now{background:#111827;color:#fff;border-radius:7px;padding:1px 5px}
.blank-done{background:#e5e7eb;color:#374151;border-radius:7px;padding:1px 5px}
.choices{margin-top:16px}
.choice{display:block;width:100%;text-align:left;border:2px solid #e5e7eb;background:#fff;border-radius:17px;padding:15px 14px;margin:9px 0;font-size:16px;line-height:1.45;cursor:pointer}
.choice:active{transform:scale(.995)}
.choice.correct{border-color:var(--good);background:var(--goodbg);color:#065f46}
.choice.wrong{border-color:var(--bad);background:var(--badbg);color:#991b1b}
.choice.dim{opacity:.5}
.letter{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:9px;border-radius:10px;background:#f3f4f6;font-weight:850}
.feedback{display:none;margin-top:12px;border-radius:15px;padding:13px;line-height:1.55}
.feedback.show{display:block}
.feedback.good{background:var(--goodbg);color:#065f46}
.feedback.bad{background:var(--badbg);color:#991b1b}
.explain{margin-top:7px;font-size:14px;color:#374151}
.controls{display:flex;gap:9px;margin-top:13px}
.ctrl{flex:1;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff;font-weight:800}
.ctrl.primary{background:#111827;color:#fff;border-color:#111827}
.ctrl:disabled{opacity:.4}
.notice{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:30}
.modal.show{display:flex}
.sheet{width:100%;max-width:720px;margin:auto 0 0;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.14)}
.sheet h2{margin:0 0 12px;font-size:19px}
.sheet p{font-size:13px;color:var(--muted);line-height:1.55}
.api{display:flex;gap:8px}
.api input{flex:1;border:1px solid var(--line);border-radius:13px;padding:13px;min-width:0}
.close{border:0;background:#f3f4f6;border-radius:13px;padding:0 15px;font-weight:800}
.save{margin-top:9px;width:100%;padding:13px;border:0;background:#111827;color:#fff;border-radius:13px;font-weight:800}
.loading{padding:14px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
@media (max-width:480px){.question{font-size:18px}.card{padding:15px}.choice{font-size:15.5px;padding:15px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="top">
    <div class="brand">⚖️ 민법 터치</div>
    <button class="settings" id="settings" aria-label="설정">⚙️</button>
  </div>
  <div class="progress"><div id="bar"></div></div>
</header>
<main>
  <div class="stats">
    <div class="stat"><b id="right">0</b><span>정답</span></div>
    <div class="stat"><b id="wrong">0</b><span>오답</span></div>
    <div class="stat"><b id="rate">0%</b><span>정답률</span></div>
  </div>

  <section class="card" id="card">
    <div class="meta"><span id="qno"></span><span id="blankInfo"></span></div>
    <div class="step" id="step"></div>
    <div id="qtext" class="question"></div>
    <div id="loading" class="loading hidden">4지선다를 만드는 중…</div>
    <div id="choices" class="choices"></div>
    <div id="feedback" class="feedback">
      <b id="feedbackTitle"></b>
      <div id="explain" class="explain"></div>
    </div>
    <div class="controls">
      <button class="ctrl" id="again">이 문제 다시</button>
      <button class="ctrl primary" id="next">다음</button>
    </div>
    <div class="notice">한 문장에 빈칸이 여러 개이면 첫 빈칸부터 순서대로 풉니다. 문장의 모든 빈칸을 끝내면 다음 문장은 전체 문제은행에서 무작위로 선택됩니다.</div>
  </section>
</main>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>AI 4지선다 설정</h2>
    <p>네 PDF의 원문을 그대로 사용하고, 현재 빈칸 하나에 대한 ①②③④ 선택지와 정답·간단한 해설을 AI가 생성하도록 연결할 수 있습니다.</p>
    <div class="api">
      <input id="apiKey" type="password" placeholder="OpenAI API 키 입력">
      <button class="close" id="close">닫기</button>
    </div>
    <button class="save" id="save">이 기기에 저장</button>
    <p>개인용 앱이라도 API 키는 웹페이지에 직접 노출될 수 있으므로, 완성 배포판은 서버 중계 방식으로 바꾸는 것이 안전합니다.</p>
  </div>
</div>

const blankRe = /\[[\s.]*\]/g;
const usable = BANK.filter(q => q.blankCount > 0);

let queue = [];
let current = null;
let blankIndex = 0;
let generated = null;
let right = 0, wrong = 0;
let lock = false;

const $ = id => document.getElementById(id);

function shuffled(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function newQueue() {
  queue = shuffled(usable);
}

function nextSentence() {
  if (!queue.length) newQueue();
  current = queue.pop();
  blankIndex = 0;
  generated = null;
  render();
  generateChoices();
}

function countBlanks(text) {
  return (text.match(blankRe)||[]).length;
}

function renderQuestion() {
  const text = current.text;
  let i = 0;
  const html = text.replace(blankRe, () => {
    const n = i++;
    if (n < blankIndex) return `<span class="blank-done">정답</span>`;
    if (n === blankIndex) return `<span class="blank-now">빈칸 ${n+1}</span>`;
    return `<span class="blank-done">빈칸 ${n+1}</span>`;
  });
  $("qtext").innerHTML = html.replace(/\n/g,"<br>");
}

function render() {
  $("qno").textContent = `${current.id}번`;
  const total = countBlanks(current.text);
  $("blankInfo").textContent = `${blankIndex+1} / ${total} 빈칸`;
  $("step").textContent = "이 문장의 빈칸을 앞에서부터 하나씩 풉니다.";
  renderQuestion();
  $("choices").innerHTML = "";
  $("feedback").className = "feedback";
  $("feedbackTitle").textContent = "";
  $("explain").textContent = "";
  $("loading").classList.add("hidden");
  lock = false;
  $("bar").style.width = `${Math.min(100,(blankIndex/total)*100)}%`;
}

function answer(index) {
  if(lock || !generated) return;
  lock = true;
  const buttons = [...document.querySelectorAll(".choice")];
  buttons.forEach((b,i) => {
    if(i === generated.answerIndex) b.classList.add("correct");
    if(i === index && index !== generated.answerIndex) b.classList.add("wrong");
    if(i !== generated.answerIndex && i !== index) b.classList.add("dim");
    b.disabled = true;
  });
  const ok = index === generated.answerIndex;
  if(ok) right++; else wrong++;
  $("right").textContent = right;
  $("wrong").textContent = wrong;
  const done = right+wrong;
  $("rate").textContent = done ? Math.round(right/done*100)+"%" : "0%";
  $("feedback").className = "feedback show " + (ok ? "good" : "bad");
  $("feedbackTitle").textContent = ok ? "✅ 정답" : `❌ 오답 — 정답: ${generated.answerIndex+1}번`;
  $("explain").textContent = generated.explanation || "";
  const delay = ok ? 750 : 1200;
  setTimeout(() => {
    const total = countBlanks(current.text);
    if(blankIndex + 1 < total) {
      blankIndex++;
      generated = null;
      render();
      generateChoices();
    } else {
      nextSentence();
    }
  }, delay);
}

function showChoices(data) {
  generated = data;
  $("loading").classList.add("hidden");
  $("choices").innerHTML = "";
  const names = ["①","②","③","④"];
  data.options.forEach((option,i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = `<span class="letter">${names[i]}</span>${escapeHtml(option)}`;
    b.onclick = () => answer(i);
    $("choices").appendChild(b);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function promptForBlank() {
  let k = 0;
  return current.text.replace(blankRe, () => {
    const v = k++;
    return v === blankIndex ? "【현재 빈칸】" : "＿＿＿＿";
  });
}

async function generateChoices() {
  const key = sessionStorage.getItem("mync_api_key") || localStorage.getItem("mync_api_key");
  if(!key) {
    $("loading").classList.remove("hidden");
    $("loading").textContent = "설정에서 OpenAI API 키를 넣으면 4지선다가 생성됩니다.";
    return;
  }
  $("loading").classList.remove("hidden");
  $("loading").textContent = "4지선다를 만드는 중…";
  const prompt = `
너는 대한민국 민법 객관식 문제 출제자다.
아래는 사용자가 직접 만든 빈칸 문제의 원문이다. 원문의 문장과 의미를 바꾸지 마라.
현재 빈칸 하나만 4지선다로 출제한다.
다른 빈칸은 ＿＿＿＿ 로 보이므로 현재 빈칸의 답을 추측하기 위한 맥락으로만 사용한다.
정답은 법률적으로 정확해야 하며, 현행 대한민국 민법과 판례 기준으로 판단한다.
선택지는 서로 명확히 구별되고 오직 하나만 정답이어야 한다.
반드시 JSON만 출력한다.

원문:
${promptForBlank()}

JSON 형식:
{"options":["선택지1","선택지2","선택지3","선택지4"],"answerIndex":0,"explanation":"짧은 해설"}
`;
  try {
    const res = await fetch("https://api.openai.com/v1/responses", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({
        model:"gpt-5.6-luna",
        input:prompt,
        text:{
          format:{
            type:"json_schema",
            name:"mcq",
            strict:true,
            schema:{
              type:"object",
              properties:{
                options:{type:"array",items:{type:"string"},minItems:4,maxItems:4},
                answerIndex:{type:"integer",minimum:0,maximum:3},
                explanation:{type:"string"}
              },
              required:["options","answerIndex","explanation"],
              additionalProperties:false
            }
          }
        }
      })
    });
    if(!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const out = data.output?.flatMap(x=>x.content||[]).find(x=>x.type==="output_text")?.text;
    if(!out) throw new Error("AI 응답을 읽지 못했습니다.");
    showChoices(JSON.parse(out));
  } catch(e) {
    $("loading").textContent = "4지선다 생성 실패: 설정의 API 키 또는 연결 상태를 확인하세요.";
    $("loading").classList.remove("hidden");
  }
}

$("next").onclick = () => nextSentence();
$("again").onclick = () => { generated=null; render(); generateChoices(); };
$("settings").onclick = () => {
  $("apiKey").value = sessionStorage.getItem("mync_api_key") || localStorage.getItem("mync_api_key") || "";
  $("modal").classList.add("show");
};
$("close").onclick = () => $("modal").classList.remove("show");
$("save").onclick = () => {
  const key = $("apiKey").value.trim();
  if(key) {
    localStorage.setItem("mync_api_key",key);
    sessionStorage.setItem("mync_api_key",key);
  } else {
    localStorage.removeItem("mync_api_key");
    sessionStorage.removeItem("mync_api_key");
  }
  $("modal").classList.remove("show");
  if(current) generateChoices();
};

newQueue();
nextSentence();
</script>
</body>
</html>
